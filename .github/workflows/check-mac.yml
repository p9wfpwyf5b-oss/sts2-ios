
name: Build STS2 Weaver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build STS2Weaver
        run: |
          dotnet build src/STS2Weaver/STS2Weaver.csproj \
            -c Release

      - name: Verify output
        run: |
          test -f src/STS2Weaver/bin/Release/net9.0/STS2Weaver.dll
          echo "STS2Weaver build successful!"
